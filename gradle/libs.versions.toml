[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
appcompat = "1.6.1"
material = "1.10.0"
langchain4j = "1.12.2"
okhttp = "4.12.0"
gson = "2.13.2"
constraintlayout = "2.1.4"
utilcode = "1.31.1"
ok2curl = "0.8.0"
lifecycle = "2.6.2"
mmkv = "2.3.0"
adapter = "4.3.0"
glide = "5.0.5"
transformations = "4.3.0"
easyfloat = "2.0.4"
nanohttpd = "2.3.1"
kadb = "1.3.0"
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
langchain4j-core = { group = "dev.langchain4j", name = "langchain4j-core", version.ref = "langchain4j" }
langchain4j-openai = { group = "dev.langchain4j", name = "langchain4j-open-ai", version.ref = "langchain4j" }
langchain4j-anthropic = { group = "dev.langchain4j", name = "langchain4j-anthropic", version.ref = "langchain4j" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
utilcode = { group = "com.blankj", name = "utilcodex", version.ref = "utilcode" }
ok2curl = { module = "com.github.mrmike:ok2curl", version.ref = "ok2curl" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
mmkv = { module = "com.tencent:mmkv-static", version.ref = "mmkv" }
adapter = { module = "com.drakeet.multitype:multitype", version.ref = "adapter" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-transformations = { module = "jp.wasabeef:glide-transformations", version.ref = "transformations" }
easyfloat = { module = "com.github.princekin-f:EasyFloat", version.ref = "easyfloat" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
kadb = { group = "com.flyfishxu", name = "kadb", version.ref = "kadb" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
